name: ci

on:
  push:
    branches: [main, "recovery/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: helm lint charts/ledger-api
      - run: helm template ledger-api charts/ledger-api -f tests/fixtures/values-minimal.yaml

