name: ci

on:
  push:
    branches: [main, "recovery/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - run: python -m pip install -e '.[dev]'
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff lint
        run: ruff check .
      - name: mypy (strict)
        run: mypy src
      - name: pytest with coverage gate
        run: pytest --cov=chartpub --cov-report=term-missing --cov-fail-under=90
      - name: build distribution
        run: python -m build
      - name: helm lint
        run: helm lint --strict charts/ledger-api
      - name: render every values fixture
        run: |
          helm template ledger-api charts/ledger-api -f tests/fixtures/values-minimal.yaml
          helm template ledger-api charts/ledger-api -f tests/fixtures/values-ha.yaml
      - name: chartpub validates the candidate without touching the remote
        run: chartpub publish --dry-run --contract publication-contract.json

  smoke:
    name: packaged chart installs against a real API server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - run: python -m pip install -e '.'
      - name: create a throwaway cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chartpub-smoke
      - name: package the chart deterministically
        run: |
          python - <<'PY'
          from pathlib import Path
          from chartpub.archive import package_chart
          artifact = package_chart(Path("charts/ledger-api"), Path("dist-chart"), "0.4.1")
          print(artifact.path, artifact.sha256)
          PY
      - name: packaging is reproducible
        run: |
          python - <<'PY'
          from pathlib import Path
          from chartpub.archive import package_chart
          first = package_chart(Path("charts/ledger-api"), Path("dist-chart-a"), "0.4.1")
          second = package_chart(Path("charts/ledger-api"), Path("dist-chart-b"), "0.4.1")
          assert first.sha256 == second.sha256, (first.sha256, second.sha256)
          print("reproducible:", first.sha256)
          PY
      - name: install the packaged archive in an isolated test release
        run: |
          helm install chartpub-smoke dist-chart/ledger-api-0.4.1.tgz \
            --namespace chartpub-verify --create-namespace \
            --dry-run=server
      - name: install every values fixture in an isolated test release
        run: |
          for values in tests/fixtures/values-minimal.yaml tests/fixtures/values-ha.yaml; do
            helm install "chartpub-smoke-$(basename "$values" .yaml)" \
              dist-chart/ledger-api-0.4.1.tgz \
              --namespace chartpub-verify --create-namespace \
              --values "$values" --dry-run=server
          done
